[project]
name = "mobile-rag"
version = "0.1.0"
description = "On-device retrieval-augmented generation for mobile."
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30,<2",
    "tokenizers>=0.21,<1",
    "numpy>=1.26,<3",
    "onnxruntime>=1.17,<2",
    "pillow>=12.3.0",
    "pydantic>=2.10,<3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.optional-dependencies]
generation = []

[dependency-groups]
dev = [
    "ipykernel>=6.25",
    "nbclient>=0.5",
    "nbformat>=5.9",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
